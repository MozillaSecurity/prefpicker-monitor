[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=1.0.0"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover"
]

[tool.coverage.run]
omit = [
  "*/.egg/*",
  "*/.tox/*",
  "*/build/*",
  "*/dist/*",
  "*/setup.py",
  "*/tests/*"
]

[tool.isort]
force_sort_within_sections = false
known_first_party = "prefmonitor"
profile = "black"

[tool.mypy]
disallow_subclassing_any = "False"
exclude = "^.*tests.*$"
ignore_missing_imports = "True"
implicit_reexport = "True"
strict = "True"

[tool.poetry]
authors = [
  "Jason Kratzer <jkratzer@mozilla.com>"
]
description = "Prefpicker bug dependency monitor"
homepage = "https://github.com/MozillaSecurity/prefpicker-monitor"
license = "MPL-2.0"
maintainers = [
  "Mozilla Fuzzing Team <fuzzing@mozilla.com>"
]
name = "prefmonitor"
packages = [{from = "src", include = "prefmonitor"}]
readme = "README.md"
repository = "https://github.com/MozillaSecurity/prefpicker"
version = "1.0.0"

[tool.poetry.dependencies]
PyGithub = "^2.2.0"
bugsy = "^0.12.0"
prefpicker = {git = "https://github.com/MozillaSecurity/prefpicker.git"}
python = "^3.8.1"
six = "^1.16.0"

[tool.poetry.group.dev.dependencies]
black = "^24.2.0"
codecov = "^2.1.13"
flake8 = "^7.0.0"
flake8-isort = "^6.1.1"
flake8-quotes = "^3.4.0"
gitlint = "^0.19.1"
mypy = "^1.9.0"
pre-commit = "^2.18.1"
pylint = "^3.1.0"
pytest = "^8.0.2"
pytest-black = "^0.3.12"
pytest-cov = "^4.1.0"
pytest-flake8 = "^1.1.1"
pytest-mock = "^3.12.0"
pytest-pylint = "^0.21.0"
python-semantic-release = "^9.1.1"
toml-sort = "^0.23.1"
tox = "^4.14.1"
types-pyyaml = "^6.0.12.20240311"

[tool.poetry.scripts]
prefmonitor = "prefmonitor.main:main"

[tool.pylint.MASTER]
load-plugins = "pylint.extensions.docparams,pylint.extensions.docstyle"

[tool.pylint.format]
max-line-length = 88

[tool.pylint.messages_control]
disable = [
  "bad-continuation",
  "fixme",
  "invalid-name",
  "line-too-long",
  "logging-format-interpolation",
  "logging-fstring-interpolation",
  "missing-module-docstring",
  "missing-return-doc",
  "missing-yield-doc",
  "too-few-public-methods",
  "too-many-arguments",
  "too-many-branches",
  "too-many-instance-attributes",
  "too-many-lines",
  "too-many-locals",
  "too-many-nested-blocks",
  "too-many-return-statements",
  "too-many-statements",
  "useless-object-inheritance"
]

[tool.pytest.ini_options]
log_level = "DEBUG"

[tool.semantic_release]
branch = "main"
build_command = "pip install poetry && poetry build"
commit_message = "chore(release): {version} [skip ci]"
upload_to_vcs_release = false
version_toml = ["pyproject.toml:tool.poetry.version"]
